services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: our_sell
      POSTGRES_USER: our_sell
      POSTGRES_PASSWORD: our_sell
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U our_sell -d our_sell"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      DATABASE_URL: postgres://our_sell:our_sell@postgres:5432/our_sell?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-our-sell-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-our-sell-client}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Our Sell}"
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10s}
      EMAIL_VERIFICATION_URL: ${EMAIL_VERIFICATION_URL:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-}
      FACEBOOK_FRONTEND_URL: ${FACEBOOK_FRONTEND_URL:-http://localhost:3000}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v26.0}
      FACEBOOK_TOKEN_ENCRYPTION_KEY: ${FACEBOOK_TOKEN_ENCRYPTION_KEY:-}
      BAKONG_API_TOKEN: ${BAKONG_API_TOKEN:-}
      BAKONG_API_BASE_URL: ${BAKONG_API_BASE_URL:-https://api-bakong.nbc.gov.kh}
      BAKONG_ACCOUNT_ID: ${BAKONG_ACCOUNT_ID:-}
      BAKONG_MERCHANT_NAME: "${BAKONG_MERCHANT_NAME:-Our Sell}"
      BAKONG_MERCHANT_CITY: "${BAKONG_MERCHANT_CITY:-Phnom Penh}"
      BAKONG_MERCHANT_ID: ${BAKONG_MERCHANT_ID:-}
      BAKONG_ACQUIRING_BANK: ${BAKONG_ACQUIRING_BANK:-}
      BAKONG_STORE_LABEL: "${BAKONG_STORE_LABEL:-Our Sell Wallet}"
      BAKONG_TOPUP_TTL: ${BAKONG_TOPUP_TTL:-15m}
      BAKONG_MIN_TOPUP_USD: ${BAKONG_MIN_TOPUP_USD:-1}
      BAKONG_MAX_TOPUP_USD: ${BAKONG_MAX_TOPUP_USD:-10000}
      BAKONG_WEBHOOK_SECRET: ${BAKONG_WEBHOOK_SECRET:-}
      BAKONG_HTTP_TIMEOUT: ${BAKONG_HTTP_TIMEOUT:-10s}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data_v18:
  redis_data:
